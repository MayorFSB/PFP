services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pfp
      POSTGRES_PASSWORD: pfp
      POSTGRES_DB: pfp
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - "6380:6379"

volumes:
  pgdata:
