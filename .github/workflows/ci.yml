name: ci

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check .

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run mypy app

  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pfp
          POSTGRES_PASSWORD: pfp
          POSTGRES_DB: pfp_test
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready -U pfp" --health-interval=5s --health-retries=5
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
    env:
      PFP_DATABASE_URL: postgresql+asyncpg://pfp:pfp@localhost:5432/pfp_test
      PFP_VALKEY_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run alembic upgrade head
      - run: uv run pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t pfp:${{ github.sha }} .
