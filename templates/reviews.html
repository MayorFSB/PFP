{% extends "base.html" %}
{% block title %}Отзывы — сеть парикмахерских PFP{% endblock %}
{% block content %}
<h1 class="font-display">Отзывы</h1>
<p style="color:var(--muted);max-width:60ch">Что говорят гости сети PFP. Средняя оценка стрижки — 4.9 из 5.</p>

<div class="list" style="margin-top:1.2rem">
  {% for r in reviews %}
  <div class="card review">
    <span><span class="who">{{ r.name }}</span>{{ r.text }}</span>
  </div>
  {% endfor %}
</div>

<div class="cta" style="margin-top:1.6rem">
  <a class="btn" href="/filials">Выбрать филиал</a>
</div>
{% endblock %}
