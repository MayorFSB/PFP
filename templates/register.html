{% extends "base.html" %}
{% block title %}Регистрация{% endblock %}
{% block content %}
<h1>Регистрация</h1>
<form method="post" action="/register">
<input type="hidden" name="csrf_token" value="{{ csrf_token }}">
<label>Email <input type="email" name="email" required></label>
<label>Пароль <input type="password" name="password" required minlength="8"></label>
<label class="check"><input type="checkbox" name="pd_consent" value="1" required> Согласен с <a href="/policy">обработкой персональных данных</a> (152-ФЗ)</label>
<button>Зарегистрироваться</button>
</form>
<p>Уже есть аккаунт? <a href="/login">Войти</a></p>
{% endblock %}
