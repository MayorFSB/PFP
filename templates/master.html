{% extends "base.html" %}
{% block title %}Кабинет мастера{% endblock %}
{% block content %}
<h1>Записи ко мне</h1>
<table><tr><th>Когда</th><th>Услуга</th><th>Статус</th></tr>
{% for b, s in rows %}
<tr><td>{{ b.start_at.strftime("%d.%m %H:%M") }}</td><td>{{ s.name }}</td><td>{{ b.status }}</td></tr>
{% else %}<tr><td colspan="3">Записей нет</td></tr>
{% endfor %}
</table>
{% endblock %}
