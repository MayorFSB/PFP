[project]
name = "pfp"
version = "0.1.0"
description = "PFP — сеть парикмахерских (FastAPI portfolio)"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.5",
    "email-validator>=2.2",
    "pwdlib[argon2]>=0.2",
    "python-jose[cryptography]>=3.3",
    "httpx>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "redis>=5.0",
    "structlog>=24.4",
    "prometheus-client>=0.20",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    "faker>=25.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
# B008: Depends() в дефолтах — идиома FastAPI, не баг
per-file-ignores = { "app/**/router.py" = ["B008"], "app/**/deps.py" = ["B008"], "tests/**" = ["B008", "S110", "BLE001"] }

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
