server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # локальный запуск: лог приложения на хосте (uvicorn > observability/logs/app.log)
  - job_name: app
    static_configs:
      - labels:
          app: pfp
          __path__: /var/log/pfp/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            path: path
            status: status
      - labels:
          level:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        filters:
          - name: label
            values: ["com.docker.compose.project=pfp"]
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        target_label: container
    pipeline_stages:
      - json:
          expressions:
            level: level
            path: path
            status: status
      - labels:
          container:
