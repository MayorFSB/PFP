apiVersion: 1
groups:
  - orgId: 1
    name: pfp-slo
    folder: PFP
    interval: 1m
    rules:
      - uid: pfp-high-p95
        title: HTTP p95 > 800ms
        condition: C
        for: 5m
        annotations:
          summary: "Латентность выше SLO: p95 {{ $values.B }}s за 5м"
          description: "Проверить /metrics и дашборд: рост p95 по эндпоинтам."
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: histogram_quantile(0.95, sum by (le) (rate(http_latency_seconds_bucket[5m])))
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0.8] }

      - uid: pfp-5xx
        title: 5xx в ответах API
        condition: C
        for: 1m
        annotations:
          summary: "5xx за 5м: {{ $values.B }}"
          description: "Ошибка на стороне сервера — смотреть логи в Loki (level=error)."
        labels:
          severity: critical
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: sum(increase(http_requests_total{status=~"5.."}[5m]))
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0] }

      - uid: pfp-cache-cold
        title: Cache hit ratio < 70%
        condition: C
        for: 10m
        annotations:
          summary: "Кэш работает плохо: hit ratio {{ $values.B }}"
          description: "Промахи кэша слотов: проверить Valkey и инвалидации."
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: sum(rate(cache_hits_total[10m])) / (sum(rate(cache_hits_total[10m])) + sum(rate(cache_miss_total[10m])))
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: lt, params: [0.7] }
